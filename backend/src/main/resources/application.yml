spring:
  application:
    name: luxora-commerce
  datasource:
    url: ${DATABASE_URL:jdbc:sqlserver://localhost:1433;databaseName=luxora;encrypt=true;trustServerCertificate=true}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:123123}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

luxora:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cart:
    ttl: ${CART_TTL:PT24H}
  returns:
    window: ${RETURN_WINDOW:P14D}
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:PT168H}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
      hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY1234567890}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/orders}
  shipping:
    provider: ${SHIPPING_PROVIDER:MOCK}
    ghn:
      api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
      token: ${GHN_TOKEN:d017a81e-190e-11ee-8bfa-8a0ded896952}
      shop-id: ${GHN_SHOP_ID:124922}
      from-district-id: ${GHN_FROM_DISTRICT_ID:1442}
      from-ward-code: ${GHN_FROM_WARD_CODE:20101}
      client-phone: ${GHN_CLIENT_PHONE:0901234567}
      webhook-token: ${GHN_WEBHOOK_TOKEN:luxora_ghn_webhook_secret_key}
  aws:
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_ENDPOINT:}
    access-key-id: ${AWS_ACCESS_KEY_ID:mock-access-key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:mock-secret-key}
    s3:
      bucket: ${AWS_S3_BUCKET:luxora-media}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_TTL:PT15M}
    ses:
      from-email: ${AWS_SES_FROM_EMAIL:noreply@luxora.com}
    sqs:
      queue-url: ${AWS_SQS_QUEUE_URL:}
    sns:
      topic-arn: ${AWS_SNS_TOPIC_ARN:}




